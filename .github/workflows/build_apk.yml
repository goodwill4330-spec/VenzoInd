name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VenzoInd APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Configure Android SDK Licenses & Tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78717b9d04596d004d" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a578e447d4525d71a64ecd30130" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a578e447d4525d71a64ecd30130" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "791207295465b338e12910e6f73e75e1464e9d9b" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo "601085b94c2773b5470201003f85e35465b614ac" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b649200215ec526e35f47e30b70f90fb4e" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo "e9acab5b5fbb560a72cfa4f6fb0b1fcd4970a231" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-sysimage-license"
          echo "e9acab5b5fbb560a72cfa4f6fb0b1fcd4970a231" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Prepare Secrets, Environment & Google Services
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat << 'EOF' > .env
GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345
FIREBASE_APPCHECK_DEBUG_TOKEN=
EOF
          cp .env .env.example
          cp .env secrets.properties
          cp .env local.defaults.properties

          mkdir -p app
          cp .env app/.env
          cp .env app/.env.example
          cp .env app/secrets.properties
          cp .env app/local.defaults.properties

          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "505106989844",
    "project_id": "bharatchat-sovereign",
    "storage_bucket": "bharatchat-sovereign.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:505106989844:android:bharatchat",
        "android_client_info": {
          "package_name": "com.aistudio.bharatchat.vnrkzp"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyB0haratChatSecureFallbackKey2026"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Build Debug APK
        env:
          KEY_PASSWORD: android
          STORE_PASSWORD: android
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon -x test -x lint -x check -x verifyRoborazziDebug -x screenshotTests

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VenzoInd-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
