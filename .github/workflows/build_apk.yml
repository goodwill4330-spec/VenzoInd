name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK & Licenses
        run: |
          # Grant write permissions to the Android SDK directory for the runner user
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk 2>/dev/null || true
          
          mkdir -p "$ANDROID_HOME/licenses" || true
          mkdir -p "$ANDROID_SDK_ROOT/licenses" || true
          
          # Pre-accept all Android SDK licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          printf "601085b94cd77f6b44b86ee5009d70427e523b70\n" > "$ANDROID_HOME/licenses/android-googletv-license" || true
          printf "33b6a2b64920216427e14ba3d7b2183d657531d0\n" > "$ANDROID_HOME/licenses/google-gdk-license" || true
          printf "e9acab5b5fbb5186e0627d296604266aea4c82da\n" > "$ANDROID_HOME/licenses/mips-android-sysimage-license" || true
          
          cp -r "$ANDROID_HOME/licenses" "$ANDROID_SDK_ROOT/" 2>/dev/null || true
          
          SDKMANAGER=$(which sdkmanager 2>/dev/null || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          fi
          
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Prepare Config and Secrets
        run: |
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" > .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> .env

          cp .env .env.example
          cp .env secrets.properties
          cp .env local.defaults.properties

          mkdir -p app
          cp .env app/.env
          cp .env app/.env.example
          cp .env app/secrets.properties
          cp .env app/local.defaults.properties

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK with Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VenzoInd-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14


