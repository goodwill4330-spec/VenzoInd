name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses & Install Components
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "platforms;android-36" "build-tools;36.0.0" --channel=3 || true
        sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true

    - name: Make Gradlew Executable & Setup Environment
      run: |
        chmod +x ./gradlew || true
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi
        touch .env
        touch .env.example

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew :app:assembleDebug --stacktrace --no-daemon -x test -x lint -x check
        else
          gradle :app:assembleDebug --stacktrace --no-daemon -x test -x lint -x check
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: BharatChat-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
