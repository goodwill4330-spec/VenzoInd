name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VenzoInd APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Secrets, Environment & Keystore
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat << 'EOF' > .env
GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345
FIREBASE_APPCHECK_DEBUG_TOKEN=
EOF
          cp .env .env.example
          cp .env secrets.properties
          cp .env local.defaults.properties

          mkdir -p app
          cp .env app/.env
          cp .env app/.env.example
          cp .env app/secrets.properties
          cp .env app/local.defaults.properties

          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "505106989844",
    "project_id": "bharatchat-sovereign",
    "storage_bucket": "bharatchat-sovereign.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:505106989844:android:bharatchat",
        "android_client_info": {
          "package_name": "com.aistudio.bharatchat.vnrkzp"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyB0haratChatSecureFallbackKey2026"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Build Debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          arguments: ':app:assembleDebug --stacktrace --no-daemon -x test -x lint -x check -x verifyRoborazziDebug -x screenshotTests'

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VenzoInd-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
