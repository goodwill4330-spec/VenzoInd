name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VenzoInd APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK Environment & PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/tools/bin" >> $GITHUB_PATH

      - name: Install Android 36 SDK & Accept Licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78717b9d04596d004d\n84831b9409646a578e447d4525d71a64ecd30130\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a578e447d4525d71a64ecd30130\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          "$SDKMANAGER" --install --channel=3 "platforms;android-36" "build-tools;36.0.0" || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Secrets, Environment & Google Services
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_HOME" > local.properties

          printf "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345\nFIREBASE_APPCHECK_DEBUG_TOKEN=\n" > .env
          printf "GEMINI_API_KEY=\nFIREBASE_APPCHECK_DEBUG_TOKEN=\n" > .env.example
          printf "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345\nFIREBASE_APPCHECK_DEBUG_TOKEN=\n" > secrets.properties
          printf "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345\nFIREBASE_APPCHECK_DEBUG_TOKEN=\n" > local.defaults.properties

          mkdir -p app
          cp .env app/.env 2>/dev/null || true
          cp secrets.properties app/secrets.properties 2>/dev/null || true

          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "505106989844",
    "project_id": "bharatchat-sovereign",
    "storage_bucket": "bharatchat-sovereign.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:505106989844:android:bharatchat",
        "android_client_info": {
          "package_name": "com.aistudio.bharatchat.vnrkzp"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyB0haratChatSecureFallbackKey2026"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VenzoInd-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
