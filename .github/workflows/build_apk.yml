name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Prepare SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Prepare Secrets, Keystore & Properties
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" > .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> .env
          cp .env .env.example
          cp .env secrets.properties
          cp .env local.defaults.properties

          mkdir -p app
          cp .env app/.env
          cp .env app/.env.example
          cp .env app/secrets.properties
          cp .env app/local.defaults.properties

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" >> app/local.properties

          # Ensure app/google-services.json is always present
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "505106989844",
    "project_id": "bharatchat-sovereign",
    "storage_bucket": "bharatchat-sovereign.appspot.com"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:505106989844:android:bharatchat",
        "android_client_info": {
          "package_name": "com.aistudio.bharatchat.vnrkzp"
        }
      },
      "oauth_client": [
        {
          "client_id": "505106989844-mockclientid.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyB0haratChatSecureFallbackKey2026"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    },
    {
      "client_info": {
        "mobilesdk_app_id": "1:505106989844:android:bharatchat2",
        "android_client_info": {
          "package_name": "com.example"
        }
      },
      "oauth_client": [
        {
          "client_id": "505106989844-mockclientid2.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyB0haratChatSecureFallbackKey2026"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug -x test -x lint --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VenzoInd-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

