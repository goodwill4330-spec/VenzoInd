name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android 36 SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Prepare Secrets & Properties
        run: |
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" > .env
          echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> .env
          cp .env .env.example
          cp .env secrets.properties
          cp .env local.defaults.properties

          mkdir -p app
          cp .env app/.env
          cp .env app/.env.example
          cp .env app/secrets.properties
          cp .env app/local.defaults.properties

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" >> app/local.properties

      - name: Build Debug APK
        run: |
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew
          ./gradlew :app:assembleDebug -x test -x lint --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: VenzoInd-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
