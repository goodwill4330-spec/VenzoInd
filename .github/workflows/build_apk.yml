name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Prepare Secrets and Environment
      run: |
        echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" > .env
        echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> .env
        echo "GEMINI_API_KEY=" > .env.example
        echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> .env.example
        echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" > secrets.properties
        echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> secrets.properties
        echo "GEMINI_API_KEY=AIzaSyFakeKeyForCiWorkflowOnly12345" > local.defaults.properties
        echo "FIREBASE_APPCHECK_DEBUG_TOKEN=" >> local.defaults.properties
        mkdir -p app
        if [ ! -f "app/google-services.json" ]; then
          cat << 'EOF' > app/google-services.json
{
  "project_info": { "project_number": "505106989844", "project_id": "bharatchat-sovereign", "storage_bucket": "bharatchat-sovereign.appspot.com" },
  "client": [ { "client_info": { "mobilesdk_app_id": "1:505106989844:android:bharatchat", "android_client_info": { "package_name": "com.aistudio.bharatchat.vnrkzp" } }, "oauth_client": [], "api_key": [ { "current_key": "AIzaSyB0haratChatSecureFallbackKey2026" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
  "configuration_version": "1"
}
EOF
        fi
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        fi
        chmod +x ./gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace --no-daemon -x test -x lint -x check

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: BharatChat-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
