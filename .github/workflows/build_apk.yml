name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses & Install Components
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager --install "platforms;android-36" "build-tools;36.0.0" --channel=3 || true
        sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: true

    - name: Prepare Keystore and Environment
      run: |
        touch local.defaults.properties
        touch secrets.properties
        touch .env
        touch .env.example
        if [ ! -f "app/google-services.json" ]; then
          mkdir -p app
          cat << 'EOF' > app/google-services.json
        {
          "project_info": { "project_number": "505106989844", "project_id": "bharatchat-sovereign", "storage_bucket": "bharatchat-sovereign.appspot.com" },
          "client": [ { "client_info": { "mobilesdk_app_id": "1:505106989844:android:bharatchat", "android_client_info": { "package_name": "com.aistudio.bharatchat.vnrkzp" } }, "oauth_client": [], "api_key": [ { "current_key": "AIzaSyB0haratChatSecureFallbackKey2026" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
          "configuration_version": "1"
        }
        EOF
        fi
        gradle wrapper --gradle-version 8.13 --distribution-type all || true
        chmod +x ./gradlew || true
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f "debug.keystore" ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        fi

    - name: Build Debug APK
      run: |
        mkdir -p app/build/outputs/apk/debug
        gradle :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache --warning-mode all -x test -x lint -x check -x verifyRoborazziDebug || ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache -x test -x lint -x check -x verifyRoborazziDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: BharatChat-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
